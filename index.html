<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ThermoSystems</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f1f3f6);
    --text: var(--tg-theme-text-color, #15181d);
    --hint: var(--tg-theme-hint-color, #7b8390);
    --accent: var(--tg-theme-button-color, #1f6fd1);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: rgba(127, 135, 150, .22);
    --ok: #1f9d55; --warn: #d98a00; --bad: #d64545;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text);
    font: 16px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 12px 16px 110px; }
  header { display: flex; align-items: center; gap: 12px; margin: 4px 0 12px; }
  .logo { width: 44px; height: 44px; border-radius: 12px; background: var(--accent); color: var(--accent-text);
    display: grid; place-items: center; font-weight: 800; font-size: 18px; flex: none; }
  header b { display: block; font-size: 18px; }
  header small { color: var(--hint); }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--bg); padding: 4px;
    border-radius: 14px; margin-bottom: 14px; }
  .tabs button { border: 0; background: transparent; color: var(--text); font: inherit; font-weight: 600; font-size: 13px;
    padding: 11px 2px; border-radius: 11px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tabs button.on { background: var(--accent); color: var(--accent-text); }
  .card { background: var(--bg); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  h2 { font-size: 17px; margin: 0 0 10px; }
  .hint { color: var(--hint); font-size: 14px; }

  /* ---- карта мастера ---- */
  .loyal { position: relative; overflow: hidden; border-radius: 20px; padding: 18px; color: #fff; margin-bottom: 12px;
    background: linear-gradient(135deg, #0f3d7a 0%, #1f6fd1 55%, #f08a24 140%); box-shadow: 0 8px 24px rgba(15,61,122,.25); }
  .loyal::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%;
    background: rgba(255,255,255,.10); }
  .loyal .brand { font-weight: 800; letter-spacing: .5px; }
  .loyal .lvl { position: absolute; right: 18px; top: 18px; background: rgba(255,255,255,.18); border-radius: 999px;
    padding: 3px 10px; font-size: 13px; font-weight: 600; z-index: 1; }
  .loyal .bal small { display: block; opacity: .8; font-size: 13px; margin-top: 18px; }
  .loyal .bal b { font-size: 30px; letter-spacing: .3px; }
  .loyal .row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 16px; gap: 10px; }
  .loyal .code { font: 700 20px/1.2 ui-monospace, "SF Mono", Consolas, monospace; letter-spacing: 1.5px; }
  .loyal .nm { opacity: .9; font-size: 14px; margin-top: 2px; }
  .loyal .cb { text-align: right; font-size: 13px; opacity: .9; }
  .loyal .cb b { display: block; font-size: 20px; }
  .qrbox { display: flex; gap: 14px; align-items: center; }
  .qr { width: 132px; height: 132px; flex: none; background: #fff; border-radius: 12px; padding: 8px; display: grid; place-items: center; }
  .qr img, .qr svg { width: 100%; height: 100%; image-rendering: pixelated; }
  .copy { margin-top: 8px; border: 1px solid var(--line); background: var(--bg2); color: var(--text); border-radius: 10px;
    padding: 8px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stats div { background: var(--bg2); border-radius: 12px; padding: 10px; }
  .stats small { display: block; color: var(--hint); font-size: 13px; }
  .stats b { font-size: 17px; }

  /* ---- макет дома: где утепление ---- */
  .house { width: 100%; height: auto; display: block; margin: 4px 0 6px; }
  .house .z { cursor: pointer; transition: opacity .15s; }
  .house .z .hl { fill: #1f6fd1; opacity: 0; transition: opacity .15s; }
  .house .z.on .hl { opacity: .22; }
  .house .z.on .mk circle { fill: #f08a24; }
  .house .mk circle { fill: #1f6fd1; stroke: #fff; stroke-width: 2.5; }
  .house .mk text { fill: #fff; font: 700 13px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .legend button { display: flex; align-items: center; gap: 8px; text-align: left; border: 2px solid var(--line); background: var(--bg);
    color: var(--text); border-radius: 12px; padding: 8px 10px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .legend button.on { border-color: #f08a24; }
  .legend .n { width: 22px; height: 22px; border-radius: 50%; background: #1f6fd1; color: #fff; display: grid; place-items: center;
    font-size: 12px; flex: none; }
  .legend button.on .n { background: #f08a24; }
  .zinfo { margin-top: 12px; background: var(--bg2); border-radius: 14px; padding: 14px; }
  .zinfo .zt { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; }
  .zinfo .zt span { font-size: 28px; }
  .zinfo p { margin: 6px 0 12px; color: var(--hint); }
  .ask.report { background: var(--bg); margin-bottom: 12px; }
  .ask { width: 100%; border: 2px solid var(--accent); background: transparent; color: var(--accent); border-radius: 12px;
    padding: 12px; font: inherit; font-weight: 700; cursor: pointer; }

  /* ---- заказы ---- */
  .order { border-top: 1px solid var(--line); padding: 12px 0; }
  .order:first-of-type { border-top: 0; padding-top: 0; }
  .order .top { display: flex; justify-content: space-between; gap: 8px; }
  .badge { font-size: 13px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; font-weight: 600; }
  .b-new { background: rgba(217,138,0,.15); color: var(--warn); }
  .b-confirmed { background: rgba(31,111,209,.15); color: var(--accent); }
  .b-paid { background: rgba(31,157,85,.15); color: var(--ok); }
  .b-cancelled { background: rgba(214,69,69,.13); color: var(--bad); }
  .empty { color: var(--hint); text-align: center; padding: 18px 0; }

  .cta { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg2) 70%, transparent); }
  .cta button { display: block; width: 100%; max-width: 528px; margin: 0 auto; border: 0; border-radius: 14px; padding: 16px;
    font: inherit; font-weight: 700; font-size: 17px; background: var(--accent); color: var(--accent-text); cursor: pointer; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">TS</div>
    <div><b>ThermoSystems</b><small id="hello"></small></div>
  </header>

  <div class="tabs">
    <button data-tab="use" class="on"></button>
    <button data-tab="card"></button>
    <button data-tab="mine"></button>
  </div>

  <!-- ===== 🏠 Макет дома: где какое утепление ===== -->
  <section id="page-use">
    <div class="card">
      <h2 data-t="useTitle"></h2>
      <div class="hint" data-t="useHint" style="margin:-4px 0 4px"></div>
      <svg class="house" viewBox="0 0 360 300" role="img" aria-label="house">
        <defs>
          <pattern id="pVent" width="14" height="10" patternUnits="userSpaceOnUse">
            <rect width="14" height="10" fill="#c9d3de"/><path d="M0 9.5h14M13.5 0v10" stroke="#9fb0c2" stroke-width="1"/>
          </pattern>
          <pattern id="pWet" width="8" height="8" patternUnits="userSpaceOnUse">
            <rect width="8" height="8" fill="#ead9bd"/><circle cx="2" cy="2" r=".9" fill="#d6c09c"/><circle cx="6" cy="6" r=".9" fill="#d6c09c"/>
          </pattern>
          <pattern id="pWool" width="10" height="10" patternUnits="userSpaceOnUse">
            <rect width="10" height="10" fill="#f3c66b"/><path d="M0 10L10 0" stroke="#d9a441" stroke-width="1.2"/>
          </pattern>
          <pattern id="pRoof" width="12" height="8" patternUnits="userSpaceOnUse">
            <rect width="12" height="8" fill="#8e4b3a"/><path d="M0 7.5h12" stroke="#6f3527" stroke-width="1"/>
          </pattern>
        </defs>
        <!-- небо и земля -->
        <rect x="0" y="0" width="360" height="300" rx="14" fill="#eaf2fb"/>
        <rect x="0" y="262" width="360" height="38" fill="#cfe3c4"/>
        <!-- 3: кровля -->
        <g class="z" data-z="2">
          <polygon points="36,136 180,46 324,136 306,136 180,60 54,136" fill="url(#pRoof)"/>
          <polygon class="hl" points="36,136 180,46 324,136 306,136 180,60 54,136"/>
          <g class="mk"><circle cx="252" cy="88" r="12"/><text x="252" y="88">3</text></g>
        </g>
        <!-- 6: мансарда / перекрытие -->
        <g class="z" data-z="5">
          <polygon points="58,136 180,62 302,136" fill="url(#pWool)"/>
          <polygon class="hl" points="58,136 180,62 302,136"/>
          <g class="mk"><circle cx="180" cy="112" r="12"/><text x="180" y="112">6</text></g>
        </g>
        <!-- 1: вентфасад (второй этаж) -->
        <g class="z" data-z="0">
          <rect x="60" y="136" width="150" height="60" fill="url(#pVent)"/>
          <rect x="94" y="150" width="30" height="30" fill="#7fb3e6" stroke="#fff" stroke-width="3"/>
          <rect x="150" y="150" width="30" height="30" fill="#7fb3e6" stroke="#fff" stroke-width="3"/>
          <rect class="hl" x="60" y="136" width="150" height="60"/>
          <g class="mk"><circle cx="76" cy="152" r="12"/><text x="76" y="152">1</text></g>
        </g>
        <!-- 2: мокрый фасад (первый этаж) -->
        <g class="z" data-z="1">
          <rect x="60" y="196" width="150" height="66" fill="url(#pWet)"/>
          <rect x="90" y="214" width="34" height="30" fill="#7fb3e6" stroke="#fff" stroke-width="3"/>
          <rect x="150" y="212" width="30" height="50" fill="#9a6b47"/>
          <rect class="hl" x="60" y="196" width="150" height="66"/>
          <g class="mk"><circle cx="76" cy="212" r="12"/><text x="76" y="212">2</text></g>
        </g>
        <!-- разрез: внутренние комнаты -->
        <rect x="210" y="136" width="90" height="126" fill="#fbf7f1"/>
        <rect x="210" y="136" width="90" height="126" fill="none" stroke="#9aa6b2" stroke-width="2"/>
        <!-- 4: пол -->
        <g class="z" data-z="3">
          <rect x="210" y="190" width="90" height="10" fill="url(#pWool)"/>
          <rect x="210" y="252" width="90" height="10" fill="url(#pWool)"/>
          <rect x="210" y="200" width="90" height="4" fill="#a0846a"/>
          <rect class="hl" x="210" y="190" width="90" height="14"/>
          <rect class="hl" x="210" y="252" width="90" height="10"/>
          <g class="mk"><circle cx="286" cy="240" r="12"/><text x="286" y="240">4</text></g>
        </g>
        <!-- 5: перегородки -->
        <g class="z" data-z="4">
          <rect x="250" y="136" width="9" height="54" fill="url(#pWool)"/>
          <rect x="250" y="204" width="9" height="48" fill="url(#pWool)"/>
          <rect class="hl" x="246" y="136" width="17" height="116"/>
          <g class="mk"><circle cx="232" cy="166" r="12"/><text x="232" y="166">5</text></g>
        </g>
      </svg>
      <div class="legend" id="legend"></div>
      <div class="zinfo hidden" id="zinfo">
        <div class="zt"><span id="zIco"></span><div id="zName"></div></div>
        <p id="zHint"></p>
        <button class="ask" id="askBtn" data-t="ask"></button>
      </div>
    </div>
    <button class="ask report" data-t="report"></button>
  </section>

  <!-- ===== 💳 Карта ===== -->
  <section id="page-card" class="hidden">
    <div class="loyal">
      <div class="brand">THERMOSYSTEMS</div>
      <span class="lvl" id="cLevel"></span>
      <div class="bal"><small data-t="balance"></small><b id="cBal"></b></div>
      <div class="row">
        <div><div class="code" id="cCode"></div><div class="nm" id="cName"></div></div>
        <div class="cb"><span data-t="ordersCnt"></span><b id="cCb"></b></div>
      </div>
    </div>
    <div class="card">
      <div class="qrbox">
        <div class="qr" id="qr"></div>
        <div>
          <b data-t="qrTitle"></b>
          <div class="hint" data-t="qrHint" style="margin-top:4px"></div>
          <button class="copy" id="copyBtn" data-t="copy"></button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="stats" id="stats"></div>
      <div class="hint" data-t="cbHint" style="margin-top:10px"></div>
    </div>
    <button class="ask report" data-t="report"></button>
  </section>


  <!-- ===== 📋 Мои заказы ===== -->
  <section id="page-mine" class="hidden">
    <div class="card">
      <h2 data-t="ordersTitle"></h2>
      <div id="orders"></div>
      <div class="hint" data-t="ordersHint" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <h2 data-t="reportsTitle"></h2>
      <div id="reports"></div>
    </div>
  </section>
</div>

<div class="cta"><button id="orderBtn"></button></div>

<script>
const T = {
  uz: {
    hello: "Salom, {n}!", tab_card: "💳 Kartam", tab_use: "🏠 Uy maketi", tab_mine: "📋 Buyurtmalar",
    balance: "Kartadagi bonus", ordersCnt: "To'langan buyurtmalar", sum: "so'm",
    report: "📸 Foto-hisobot yuborish — keshbek olish", reportsTitle: "📸 Foto-hisobotlarim",
    noReports: "Hali foto-hisobot yo'q. Mahsulotimiz ishlatilgan obyekt rasmini lokatsiya bilan yuboring — keshbek oling.",
    cbHint: "Har bir buyurtma va foto-hisobot uchun keshbekni menejer yozadi.",
    rst: { new: "🕐 Tekshirilmoqda", paid: "✅ Qabul qilindi", cancelled: "❌ Qabul qilinmadi" },
    qrTitle: "Karta raqami va QR-kod", qrHint: "Buyurtma berishda menejerga shu kodni ko'rsating — buyurtma sizning tarixingizga va kartangizga yoziladi.",
    copy: "📋 Raqamni nusxalash", copied: "✅ Nusxalandi",
    sAcc: "Jami hisoblangan", sPaid: "Sizga to'langan",
    useTitle: "Uyning qayerini izolyatsiya qilamiz", useHint: "Raqamni yoki pastdagi tugmani bosing.",
    ask: "💬 Qo'shimcha ma'lumot uchun — menejer",
    ordersTitle: "📋 Buyurtmalarim", ordersHint: "Buyurtmalarni menejer kartangizga yozadi. Ro'yxat bot menyusi ochilganda yangilanadi.",
    noOrders: "Hali buyurtma yo'q. Pastdagi tugma orqali menejerga yozing.",
    byManager: "menejer aytadi",
    order: "🛒 Buyurtma berish — menejer orqali",
    st: { new: "🕐 Yangi", confirmed: "👍 Tasdiqlangan", paid: "✅ To'langan", cancelled: "❌ Bekor qilingan" },
  },
  ru: {
    hello: "Здравствуйте, {n}!", tab_card: "💳 Карта", tab_use: "🏠 Макет дома", tab_mine: "📋 Заказы",
    balance: "Бонус на карте", ordersCnt: "Оплачено заказов", sum: "сум",
    report: "📸 Отправить фотоотчёт — получить кешбэк", reportsTitle: "📸 Мои фотоотчёты",
    noReports: "Фотоотчётов пока нет. Пришлите фото объекта с нашей продукцией и геолокацией — получите кешбэк.",
    cbHint: "Кешбэк за каждый заказ и фотоотчёт начисляет менеджер.",
    rst: { new: "🕐 На проверке", paid: "✅ Принят", cancelled: "❌ Не принят" },
    qrTitle: "Номер карты и QR-код", qrHint: "При заказе покажите этот код менеджеру — заказ попадёт в вашу историю и на карту.",
    copy: "📋 Скопировать номер", copied: "✅ Скопировано",
    sAcc: "Начислено всего", sPaid: "Выплачено вам",
    useTitle: "Что утепляем в доме", useHint: "Нажмите на цифру или кнопку ниже.",
    ask: "💬 Подробнее — у менеджера",
    ordersTitle: "📋 Мои заказы", ordersHint: "Заказы на вашу карту оформляет менеджер. Список обновляется при открытии меню бота.",
    noOrders: "Заказов пока нет. Напишите менеджеру кнопкой внизу.",
    byManager: "уточнит менеджер",
    order: "🛒 Заказать — через менеджера",
    st: { new: "🕐 Новый", confirmed: "👍 Подтверждён", paid: "✅ Оплачен", cancelled: "❌ Отменён" },
  },
};

// Данные приходят от бота в адресе: #d=<base64url JSON>. Без них — демо для проверки в браузере.
const DEMO = {
  l: "uz", n: "Mansur", c: "TS1001-4827", q: "https://t.me/thermosystemsuz_bot?start=card_TS1001-4827", m: "sales_thermoplus",
  bn: { due: 330000, acc: 330000, paid: 0, cnt: 1 },
  u: [["🏢", "Ventfasad", "osma fasad ostiga", []], ["🧱", "Ho'l fasad", "shtukaturka ostiga", []], ["🏠", "Tom", "tekis tom", []],
      ["🟫", "Pol", "styajka ostiga", []], ["🚪", "Ichki devorlar", "yuksiz", []], ["🔧", "Universal", "mansarda", []]],
  o: [[3, "15.10.2026", "THERMO VENT PRO 80 мм, 25 м³", 23000000, "paid", 230000]],
  r: [[1, "15.10.2026", "paid", 100000]],
};

function readData() {
  try {
    const m = location.hash.match(/d=([A-Za-z0-9_-]+)/);
    if (!m) return DEMO;
    const b64 = m[1].replace(/-/g, "+").replace(/_/g, "/");
    const bytes = Uint8Array.from(atob(b64 + "===".slice((b64.length + 3) % 4)), c => c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  } catch (e) { return DEMO; }
}

const tg = window.Telegram && window.Telegram.WebApp;
const IN_TG = !!(tg && tg.initData);   // открыто внутри Telegram (а не просто в браузере)
const D = readData();
const L = T[D.l] ? D.l : "uz";
const tr = (k, kw = {}) => (T[L][k] || "").replace(/\{(\w+)\}/g, (_, x) => kw[x] ?? "");
const $ = id => document.getElementById(id);
const fmt = n => {
  n = Math.round(Number(n || 0) * 100) / 100;
  const [i, f] = String(n).split(".");
  return i.replace(/\B(?=(\d{3})+(?!\d))/g, " ") + (f ? "." + f : "");
};
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

document.documentElement.lang = L;
document.querySelectorAll("[data-t]").forEach(e => e.textContent = tr(e.dataset.t));
$("hello").textContent = tr("hello", { n: D.n || "" });

// ---------- вкладки ----------
const tabs = [...document.querySelectorAll(".tabs button")];
tabs.forEach(b => {
  b.textContent = tr("tab_" + b.dataset.tab);
  b.onclick = () => {
    tabs.forEach(x => x.classList.toggle("on", x === b));
    ["card", "use", "mine"].forEach(p => $("page-" + p).classList.toggle("hidden", p !== b.dataset.tab));
    window.scrollTo(0, 0);
  };
});

// ---------- 💳 карта ----------
const bn = D.bn || {};
$("cLevel").textContent = "💳";
$("cBal").textContent = `${fmt(bn.due)} ${tr("sum")}`;
$("cCode").textContent = D.c || "—";
$("cName").textContent = D.n || "";
$("cCb").textContent = String(bn.cnt || 0);
[[tr("sAcc"), `${fmt(bn.acc)} ${tr("sum")}`], [tr("sPaid"), `${fmt(bn.paid)} ${tr("sum")}`]]
  .forEach(([k, v]) => { const d = el("div"); d.append(el("small", "", k), el("b", "", v)); $("stats").appendChild(d); });
try {
  const qr = qrcode(0, "M");
  qr.addData(D.q || D.c || "");
  qr.make();
  $("qr").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
} catch (e) { $("qr").textContent = D.c || ""; }
$("copyBtn").onclick = async () => {
  try { await navigator.clipboard.writeText(D.c || ""); $("copyBtn").textContent = tr("copied"); } catch (e) {}
};

// ---------- 🏠 макет дома: зоны (порядок = config.USAGE) ----------
let zone = null;
const zones = D.u || [];
zones.forEach(([icon, name], i) => {
  const b = el("button", "", null);
  b.dataset.z = i;
  b.append(el("span", "n", String(i + 1)), el("span", "", name));
  b.onclick = () => pickZone(i);
  $("legend").appendChild(b);
});
document.querySelectorAll(".house .z").forEach(g => g.addEventListener("click", () => pickZone(+g.dataset.z)));
function pickZone(i) {
  if (!zones[i]) return;
  zone = i;
  document.querySelectorAll(".house .z").forEach(g => g.classList.toggle("on", +g.dataset.z === i));
  [...$("legend").children].forEach(b => b.classList.toggle("on", +b.dataset.z === i));
  const [icon, name, hint] = zones[i];
  $("zIco").textContent = icon; $("zName").textContent = name; $("zHint").textContent = hint;
  $("zinfo").classList.remove("hidden");
  $("zinfo").scrollIntoView({ behavior: "smooth", block: "nearest" });
}
// «Подробнее — у менеджера»: открываем чат с менеджером, приложение не закрывается
$("askBtn").onclick = () => {
  if (!D.m) return;
  const url = "https://t.me/" + D.m;
  if (IN_TG) tg.openTelegramLink(url); else window.open(url, "_blank");
};

// ---------- 📋 мои заказы ----------
const orders = D.o || [];
if (!orders.length) $("orders").appendChild(el("div", "empty", tr("noOrders")));
orders.forEach(([no, date, item, total, st, cb]) => {
  const d = el("div", "order");
  const top = el("div", "top");
  const badge = el("span", "badge b-" + st, T[L].st[st] || st);
  top.append(el("b", "", `№${no} · ${date}`), badge);
  d.append(top, el("div", "", item),
    el("div", "hint", (total ? `${fmt(total)} ${tr("sum")}` : tr("byManager")) + (cb ? ` · 🎁 ${fmt(cb)} ${tr("sum")}` : "")));
  $("orders").appendChild(d);
});

// ---------- 📸 фотоотчёты ----------
const reps = D.r || [];
if (!reps.length) $("reports").appendChild(el("div", "empty", tr("noReports")));
reps.forEach(([no, date, st, cb]) => {
  const d = el("div", "order");
  const top = el("div", "top");
  top.append(el("b", "", `№${no} · ${date}`), el("span", "badge b-" + st, T[L].rst[st] || st));
  d.append(top);
  if (cb) d.append(el("div", "hint", `🎁 +${fmt(cb)} ${tr("sum")}`));
  $("reports").appendChild(d);
});
// «Фотоотчёт»: бот попросит фото и геолокацию прямо в чате
document.querySelectorAll(".ask.report").forEach(b => b.onclick = () => {
  if (IN_TG) tg.sendData(JSON.stringify({ a: "report" }));
});

// ---------- 🛒 заказ — только через менеджера ----------
$("orderBtn").textContent = tr("order");
$("orderBtn").onclick = () => {
  if (IN_TG) {
    // бот покажет контакт менеджера и передаст ему заявку с номером карты; окно закроется само
    tg.sendData(JSON.stringify({ a: "request", z: zone !== null && zones[zone] ? zones[zone][1] : "" }));
  } else if (D.m) {
    window.open("https://t.me/" + D.m, "_blank");
  }
};

if (IN_TG) { tg.ready(); tg.expand(); }
</script>
</body>
</html>
