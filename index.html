<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ThermoSystems</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f1f3f6);
    --text: var(--tg-theme-text-color, #15181d);
    --hint: var(--tg-theme-hint-color, #7b8390);
    --accent: var(--tg-theme-button-color, #1f6fd1);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: rgba(127, 135, 150, .22);
    --ok: #1f9d55; --warn: #d98a00; --bad: #d64545;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text);
    font: 16px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 12px 16px 110px; }
  header { display: flex; align-items: center; gap: 12px; margin: 4px 0 12px; }
  .logo { width: 44px; height: 44px; border-radius: 12px; background: var(--accent); color: var(--accent-text);
    display: grid; place-items: center; font-weight: 800; font-size: 18px; flex: none; }
  header b { display: block; font-size: 18px; }
  header small { color: var(--hint); }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--bg); padding: 4px;
    border-radius: 14px; margin-bottom: 14px; }
  .tabs button { border: 0; background: transparent; color: var(--text); font: inherit; font-weight: 600; font-size: 13px;
    padding: 11px 2px; border-radius: 11px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tabs button.on { background: var(--accent); color: var(--accent-text); }
  .card { background: var(--bg); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  h2 { font-size: 17px; margin: 0 0 10px; }
  .hint { color: var(--hint); font-size: 14px; }

  /* ---- карта мастера ---- */
  .loyal { position: relative; overflow: hidden; border-radius: 20px; padding: 18px; color: #fff; margin-bottom: 12px;
    background: linear-gradient(135deg, #0f3d7a 0%, #1f6fd1 55%, #f08a24 140%); box-shadow: 0 8px 24px rgba(15,61,122,.25); }
  .loyal::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%;
    background: rgba(255,255,255,.10); }
  .loyal .brand { font-weight: 800; letter-spacing: .5px; }
  .loyal .lvl { position: absolute; right: 18px; top: 18px; background: rgba(255,255,255,.18); border-radius: 999px;
    padding: 3px 10px; font-size: 13px; font-weight: 600; z-index: 1; }
  .loyal .bal small { display: block; opacity: .8; font-size: 13px; margin-top: 18px; }
  .loyal .bal b { font-size: 30px; letter-spacing: .3px; }
  .loyal .row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 16px; gap: 10px; }
  .loyal .code { font: 700 20px/1.2 ui-monospace, "SF Mono", Consolas, monospace; letter-spacing: 1.5px; }
  .loyal .nm { opacity: .9; font-size: 14px; margin-top: 2px; }
  .loyal .cb { text-align: right; font-size: 13px; opacity: .9; }
  .loyal .cb b { display: block; font-size: 20px; }
  .qrbox { display: flex; gap: 14px; align-items: center; }
  .qr { width: 132px; height: 132px; flex: none; background: #fff; border-radius: 12px; padding: 8px; display: grid; place-items: center; }
  .qr img, .qr svg { width: 100%; height: 100%; image-rendering: pixelated; }
  .copy { margin-top: 8px; border: 1px solid var(--line); background: var(--bg2); color: var(--text); border-radius: 10px;
    padding: 8px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stats div { background: var(--bg2); border-radius: 12px; padding: 10px; }
  .stats small { display: block; color: var(--hint); font-size: 13px; }
  .stats b { font-size: 17px; }

  /* ---- где какой товар (картинка-подсказка) ---- */
  .use { display: grid; grid-template-columns: 52px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .use:first-of-type { border-top: 0; padding-top: 2px; }
  .ico { width: 52px; height: 52px; border-radius: 14px; background: var(--bg2); display: grid; place-items: center; font-size: 28px; }
  .use b { display: block; font-size: 16px; }
  .use .hint { margin: 1px 0 8px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { background: var(--bg2); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .pill i { font-style: normal; color: var(--hint); font-weight: 500; }

  /* ---- заказы ---- */
  .order { border-top: 1px solid var(--line); padding: 12px 0; }
  .order:first-of-type { border-top: 0; padding-top: 0; }
  .order .top { display: flex; justify-content: space-between; gap: 8px; }
  .badge { font-size: 13px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; font-weight: 600; }
  .b-new { background: rgba(217,138,0,.15); color: var(--warn); }
  .b-confirmed { background: rgba(31,111,209,.15); color: var(--accent); }
  .b-paid { background: rgba(31,157,85,.15); color: var(--ok); }
  .b-cancelled { background: rgba(214,69,69,.13); color: var(--bad); }
  .empty { color: var(--hint); text-align: center; padding: 18px 0; }

  .cta { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg2) 70%, transparent); }
  .cta button { display: block; width: 100%; max-width: 528px; margin: 0 auto; border: 0; border-radius: 14px; padding: 16px;
    font: inherit; font-weight: 700; font-size: 17px; background: var(--accent); color: var(--accent-text); cursor: pointer; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">TS</div>
    <div><b>ThermoSystems</b><small id="hello"></small></div>
  </header>

  <div class="tabs">
    <button data-tab="card" class="on"></button>
    <button data-tab="use"></button>
    <button data-tab="mine"></button>
  </div>

  <!-- ===== 💳 Карта ===== -->
  <section id="page-card">
    <div class="loyal">
      <div class="brand">THERMOSYSTEMS</div>
      <span class="lvl" id="cLevel"></span>
      <div class="bal"><small data-t="balance"></small><b id="cBal"></b></div>
      <div class="row">
        <div><div class="code" id="cCode"></div><div class="nm" id="cName"></div></div>
        <div class="cb"><span data-t="cashback"></span><b id="cCb"></b></div>
      </div>
    </div>
    <div class="card">
      <div class="qrbox">
        <div class="qr" id="qr"></div>
        <div>
          <b data-t="qrTitle"></b>
          <div class="hint" data-t="qrHint" style="margin-top:4px"></div>
          <button class="copy" id="copyBtn" data-t="copy"></button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="stats" id="stats"></div>
      <div class="hint" id="next" style="margin-top:10px"></div>
    </div>
  </section>

  <!-- ===== 🧱 Где какой товар ===== -->
  <section id="page-use" class="hidden">
    <div class="card">
      <h2 data-t="useTitle"></h2>
      <div class="hint" data-t="useHint" style="margin:-4px 0 10px"></div>
      <div id="usage"></div>
    </div>
  </section>

  <!-- ===== 📋 Мои заказы ===== -->
  <section id="page-mine" class="hidden">
    <div class="card">
      <h2 data-t="ordersTitle"></h2>
      <div id="orders"></div>
      <div class="hint" data-t="ordersHint" style="margin-top:8px"></div>
    </div>
  </section>
</div>

<div class="cta"><button id="orderBtn"></button></div>

<script>
const T = {
  uz: {
    hello: "Salom, {n}!", tab_card: "💳 Kartam", tab_use: "🧱 Mahsulotlar", tab_mine: "📋 Buyurtmalar",
    balance: "Kartadagi bonus", cashback: "Keshbek", sum: "so'm",
    qrTitle: "Karta raqami va QR-kod", qrHint: "Buyurtma berishda menejerga shu kodni ko'rsating — buyurtma sizning tarixingizga va kartangizga yoziladi.",
    copy: "📋 Raqamni nusxalash", copied: "✅ Nusxalandi",
    sLevel: "Daraja", sDisc: "Chegirma", s90: "90 kunda xarid", sAcc: "Jami hisoblangan",
    useTitle: "Qayerga qaysi mahsulot", useHint: "Tanlashda yordam uchun. Aniq tavsiyani menejer beradi.",
    ordersTitle: "📋 Buyurtmalarim", ordersHint: "Buyurtmalarni menejer kartangizga yozadi. Ro'yxat bot menyusi ochilganda yangilanadi.",
    noOrders: "Hali buyurtma yo'q. Pastdagi tugma orqali menejerga yozing.",
    byManager: "menejer aytadi",
    order: "🛒 Buyurtma berish — menejer orqali",
    st: { new: "🕐 Yangi", confirmed: "👍 Tasdiqlangan", paid: "✅ To'langan", cancelled: "❌ Bekor qilingan" },
  },
  ru: {
    hello: "Здравствуйте, {n}!", tab_card: "💳 Карта", tab_use: "🧱 Товары", tab_mine: "📋 Заказы",
    balance: "Бонус на карте", cashback: "Кешбэк", sum: "сум",
    qrTitle: "Номер карты и QR-код", qrHint: "При заказе покажите этот код менеджеру — заказ попадёт в вашу историю и на карту.",
    copy: "📋 Скопировать номер", copied: "✅ Скопировано",
    sLevel: "Уровень", sDisc: "Скидка", s90: "Куплено за 90 дней", sAcc: "Начислено всего",
    useTitle: "Где какой товар", useHint: "Подсказка для выбора. Точную рекомендацию даст менеджер.",
    ordersTitle: "📋 Мои заказы", ordersHint: "Заказы на вашу карту оформляет менеджер. Список обновляется при открытии меню бота.",
    noOrders: "Заказов пока нет. Напишите менеджеру кнопкой внизу.",
    byManager: "уточнит менеджер",
    order: "🛒 Заказать — через менеджера",
    st: { new: "🕐 Новый", confirmed: "👍 Подтверждён", paid: "✅ Оплачен", cancelled: "❌ Отменён" },
  },
};

// Данные приходят от бота в адресе: #d=<base64url JSON>. Без них — демо для проверки в браузере.
const DEMO = {
  l: "uz", n: "Mansur", c: "TS1001-4827", q: "https://t.me/thermosystemsuz_bot?start=card_TS1001-4827",
  m: "sales_thermoplus", lv: "Hamkor", d: 5,
  bn: { lv: "Hamkor", d: 5, cb: 1, m90: 0, due: 0, acc: 0, next: "«Kumush» darajasigacha 50 m³ qoldi." },
  u: [["🏢", "Ventfasad", "osma fasad ostiga", [["THERMO VENT FACADE", 70], ["THERMO VENT PRO", 80]]],
      ["🏠", "Tom (krovlya)", "tekis tom", [["THERMO ROOF L", 100], ["THERMO ROOF U", 170]]]],
  o: [[3, "15.10.2026", "THERMO VENT PRO", 80, 25.2, 19733112, "confirmed", 0]],
};

function readData() {
  try {
    const m = location.hash.match(/d=([A-Za-z0-9_-]+)/);
    if (!m) return DEMO;
    const b64 = m[1].replace(/-/g, "+").replace(/_/g, "/");
    const bytes = Uint8Array.from(atob(b64 + "===".slice((b64.length + 3) % 4)), c => c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  } catch (e) { return DEMO; }
}

const tg = window.Telegram && window.Telegram.WebApp;
const IN_TG = !!(tg && tg.initData);   // открыто внутри Telegram (а не просто в браузере)
const D = readData();
const L = T[D.l] ? D.l : "uz";
const tr = (k, kw = {}) => (T[L][k] || "").replace(/\{(\w+)\}/g, (_, x) => kw[x] ?? "");
const $ = id => document.getElementById(id);
const fmt = n => {
  n = Math.round(Number(n || 0) * 100) / 100;
  const [i, f] = String(n).split(".");
  return i.replace(/\B(?=(\d{3})+(?!\d))/g, " ") + (f ? "." + f : "");
};
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

document.documentElement.lang = L;
document.querySelectorAll("[data-t]").forEach(e => e.textContent = tr(e.dataset.t));
$("hello").textContent = tr("hello", { n: D.n || "" });

// ---------- вкладки ----------
const tabs = [...document.querySelectorAll(".tabs button")];
tabs.forEach(b => {
  b.textContent = tr("tab_" + b.dataset.tab);
  b.onclick = () => {
    tabs.forEach(x => x.classList.toggle("on", x === b));
    ["card", "use", "mine"].forEach(p => $("page-" + p).classList.toggle("hidden", p !== b.dataset.tab));
    window.scrollTo(0, 0);
  };
});

// ---------- 💳 карта ----------
const bn = D.bn || {};
$("cLevel").textContent = `${bn.lv || D.lv || ""} · −${bn.d ?? D.d ?? 0}%`;
$("cBal").textContent = `${fmt(bn.due)} ${tr("sum")}`;
$("cCode").textContent = D.c || "—";
$("cName").textContent = D.n || "";
$("cCb").textContent = `${bn.cb || 0}%`;
[[tr("sLevel"), bn.lv || "—"], [tr("sDisc"), `${bn.d ?? 0}%`], [tr("s90"), `${fmt(bn.m90)} m³`], [tr("sAcc"), `${fmt(bn.acc)} ${tr("sum")}`]]
  .forEach(([k, v]) => { const d = el("div"); d.append(el("small", "", k), el("b", "", v)); $("stats").appendChild(d); });
$("next").textContent = bn.next || "";
try {
  const qr = qrcode(0, "M");
  qr.addData(D.q || D.c || "");
  qr.make();
  $("qr").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
} catch (e) { $("qr").textContent = D.c || ""; }
$("copyBtn").onclick = async () => {
  try { await navigator.clipboard.writeText(D.c || ""); $("copyBtn").textContent = tr("copied"); } catch (e) {}
};

// ---------- 🧱 где какой товар ----------
(D.u || []).forEach(([icon, name, hint, items]) => {
  const row = el("div", "use");
  row.appendChild(el("div", "ico", icon));
  const body = el("div");
  body.append(el("b", "", name), el("div", "hint", hint));
  const pills = el("div", "pills");
  items.forEach(([pn, dens]) => {
    const p = el("span", "pill", pn.replace(/^THERMO\s+/, ""));
    if (dens) { const i = el("i", "", ` ${dens} kg/m³`); p.appendChild(i); }
    pills.appendChild(p);
  });
  body.appendChild(pills);
  row.appendChild(body);
  $("usage").appendChild(row);
});

// ---------- 📋 мои заказы ----------
const orders = D.o || [];
if (!orders.length) $("orders").appendChild(el("div", "empty", tr("noOrders")));
orders.forEach(([no, date, name, thk, vol, total, st, bonus]) => {
  const d = el("div", "order");
  const top = el("div", "top");
  const badge = el("span", "badge b-" + st, T[L].st[st] || st);
  top.append(el("b", "", `№${no} · ${date}`), badge);
  d.append(top, el("div", "", `${name}, ${thk} mm · ${fmt(vol)} m³`),
    el("div", "hint", (total ? `${fmt(total)} ${tr("sum")}` : tr("byManager")) + (bonus ? ` · bonus +${fmt(bonus)} ${tr("sum")}` : "")));
  $("orders").appendChild(d);
});

// ---------- 🛒 заказ — только через менеджера ----------
$("orderBtn").textContent = tr("order");
$("orderBtn").onclick = () => {
  if (IN_TG) {
    // бот покажет контакт менеджера и передаст ему заявку с номером карты; окно закроется само
    tg.sendData(JSON.stringify({ a: "request" }));
  } else if (D.m) {
    window.open("https://t.me/" + D.m, "_blank");
  }
};

if (IN_TG) { tg.ready(); tg.expand(); }
</script>
</body>
</html>
